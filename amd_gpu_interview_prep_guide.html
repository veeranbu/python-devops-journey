let opened = new Set();
let totalQ = 0;

function badge(level) {
  const map = { basic: ['badge-basic','basic'], inter: ['badge-inter','intermediate'], adv: ['badge-adv','advanced'], scen: ['badge-scen','scenario'] };
  const [cls, lbl] = map[level] || ['badge-basic', level];
  return `<span class="badge ${cls}">${lbl}</span>`;
}

function toggleQ(id) {
  const body = document.getElementById('body-' + id);
  const chev = document.getElementById('chev-' + id);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
  if (!isOpen) {
    opened.add(id);
    updateProgress();
  }
}

function updateProgress() {
  const pct = totalQ > 0 ? Math.round((opened.size / totalQ) * 100) : 0;
  document.getElementById('opened-q').textContent = opened.size;
  document.getElementById('pct-q').textContent = pct + '%';
  document.getElementById('prog').style.width = pct + '%';
}

function showSection(idx) {
  document.querySelectorAll('.section').forEach((s, i) => s.classList.toggle('active', i === idx));
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
}

function buildSteps(steps) {
  return steps.map((s, i) => `<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('');
}

let qIdx = 0;
const container = document.getElementById('sections');

data.forEach((section, si) => {
  const secEl = document.createElement('div');
  secEl.className = 'section' + (si === 0 ? ' active' : '');
  secEl.innerHTML = `<div class="section-title">${section.title}</div>`;
  section.questions.forEach(q => {
    const id = qIdx++;
    totalQ++;
    const bodyContent = q.steps
      ? `<div class="answer-section"><div class="answer-label">Debug approach</div>${buildSteps(q.steps)}</div>`
      : `<div class="answer-section"><div class="answer-label">Core answer</div><div class="answer-text">${q.answer}</div></div>`;
    const amdBlock = (q.amd || q.steps) ? `<div class="amd-tip"><div class="amd-tip-label">AMD CONTEXT</div><div class="amd-tip-text">${q.amd || ''}</div></div>` : '';
    secEl.innerHTML += `
      <div class="q-block">
        <div class="q-header" onclick="toggleQ(${id})">
          <span class="q-label">${q.q}</span>
          ${badge(q.level)}
          <span class="chevron" id="chev-${id}">▼</span>
        </div>
        <div class="q-body" id="body-${id}">
          ${bodyContent}
          ${amdBlock}
        </div>
      </div>`;
  });
  container.appendChild(secEl);
});

document.getElementById('total-q').textContent = totalQ;
updateProgress();
</script>
