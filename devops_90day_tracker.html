<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps 90-Day Mastery Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #08080f;
  --bg2: #0f0f1a;
  --bg3: #161625;
  --bg4: #1e1e30;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.14);
  --text: #ededf5;
  --muted: #7878a0;
  --muted2: #5a5a7a;
  --accent: #10d48e;
  --accent2: #fb923c;
}
body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
.top-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 32px; position: sticky; top: 0; z-index: 100; }
.logo { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent); padding: 16px 0; white-space: nowrap; }
.logo span { color: var(--muted); }
.tabs { display: flex; gap: 4px; flex: 1; }
.tab { background: none; border: none; color: var(--muted); font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500; padding: 18px 16px 16px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.day-badge { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted2); padding: 16px 0; }
.day-badge b { color: var(--accent2); }

/* LAYOUT */
.container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
.panel { display: none; }
.panel.active { display: block; }

/* DASHBOARD */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.stat-value { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; }
.stat-value.green { color: var(--accent); }
.stat-value.orange { color: var(--accent2); }
.stat-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

.progress-bar { height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; margin: 12px 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #0ea5e9); border-radius: 4px; transition: width .6s ease; }

.today-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
.today-card h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; }
.today-module { display: flex; align-items: flex-start; gap: 16px; }
.module-dot { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.today-info h3 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.today-topic { font-size: 14px; color: var(--accent); font-weight: 500; margin-bottom: 8px; }
.today-desc { font-size: 14px; color: var(--muted); }

.complete-btn { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 12px 24px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s; margin-top: 16px; }
.complete-btn:hover { opacity: .85; }
.complete-btn.done { background: var(--bg4); color: var(--accent); border: 1px solid var(--accent); }

.start-section { text-align: center; padding: 80px 24px; }
.start-section h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
.start-section p { color: var(--muted); font-size: 16px; margin-bottom: 32px; }
.start-btn { background: var(--accent); color: #000; border: none; border-radius: 10px; padding: 16px 40px; font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
.start-btn:hover { opacity: .85; }

/* MODULES */
.modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 768px) { .modules-grid { grid-template-columns: 1fr; } .dash-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 500px) { .dash-grid { grid-template-columns: 1fr; } }

.module-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.module-card-header { padding: 16px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background .15s; }
.module-card-header:hover { background: var(--bg4); }
.mod-icon { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.mod-info { flex: 1; min-width: 0; }
.mod-name { font-size: 15px; font-weight: 600; }
.mod-days { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
.mod-status { font-size: 12px; }
.chevron { color: var(--muted); transition: transform .2s; }
.module-card.open .chevron { transform: rotate(180deg); }

.module-card-body { display: none; padding: 0 20px 20px; border-top: 1px solid var(--border); }
.module-card.open .module-card-body { display: block; padding-top: 16px; }

.section-label { font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; margin-top: 16px; }
.topics-list { display: flex; flex-wrap: wrap; gap: 6px; }
.topic-tag { background: var(--bg4); border: 1px solid var(--border2); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); }

.resources-list { display: flex; flex-direction: column; gap: 8px; }
.resource-link { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg4); border-radius: 8px; text-decoration: none; color: var(--text); font-size: 13px; transition: border-color .15s; border: 1px solid transparent; }
.resource-link:hover { border-color: var(--border2); }
.res-type { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.res-type.video { background: rgba(239,68,68,.15); color: #f87171; }
.res-type.article { background: rgba(59,130,246,.15); color: #60a5fa; }
.res-type.book { background: rgba(168,85,247,.15); color: #c084fc; }
.res-type.interactive { background: rgba(16,212,142,.15); color: var(--accent); }
.res-type.docs { background: rgba(251,146,60,.15); color: var(--accent2); }

.handson-box { background: rgba(16,212,142,.06); border: 1px solid rgba(16,212,142,.2); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--accent); margin-top: 4px; }

/* DAILY TRACKER */
.tracker-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.tracker-header h2 { font-size: 20px; font-weight: 600; }
.reset-btn { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 8px; padding: 8px 16px; font-family: 'Outfit', sans-serif; font-size: 13px; cursor: pointer; transition: all .2s; }
.reset-btn:hover { border-color: #ef4444; color: #ef4444; }

.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

.day-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.day-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: transform .1s, opacity .2s; font-size: 11px; font-family: 'Space Mono', monospace; font-weight: 700; border: 2px solid transparent; }
.day-cell:hover { transform: scale(1.1); z-index: 10; }
.day-cell.future { opacity: .35; cursor: default; }
.day-cell.future:hover { transform: none; }
.day-cell.completed::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 18px; color: rgba(255,255,255,.9); font-family: 'Outfit', sans-serif; }
.day-cell.completed .day-num { opacity: 0; }
.day-cell.today { border-color: rgba(255,255,255,.6); }
.day-num { font-size: 11px; }

.day-detail { background: var(--bg3); border: 1px solid var(--border2); border-radius: 12px; padding: 20px; margin-top: 24px; }
.day-detail h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.day-detail .topic { font-size: 14px; color: var(--accent); margin-bottom: 12px; }
.note-input { width: 100%; background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 14px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--text); resize: vertical; min-height: 80px; margin-top: 8px; }
.note-input::placeholder { color: var(--muted2); }
.note-input:focus { outline: none; border-color: var(--accent); }
.save-note-btn { background: var(--bg4); border: 1px solid var(--border2); color: var(--muted); border-radius: 8px; padding: 8px 16px; font-family: 'Outfit', sans-serif; font-size: 13px; cursor: pointer; margin-top: 8px; transition: all .2s; }
.save-note-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">dev<span>//</span>ops<span>.</span>tracker</div>
  <div class="tabs">
    <button class="tab active" onclick="showPanel('dashboard')">Dashboard</button>
    <button class="tab" onclick="showPanel('modules')">Modules</button>
    <button class="tab" onclick="showPanel('tracker')">Daily Tracker</button>
  </div>

<div class="container">

  </div>

  <!-- MODULES -->
  <div class="panel" id="panel-modules">

  </div>

  <!-- TRACKER -->
  <div class="panel" id="panel-tracker">
    <div class="tracker-header">
      <h2>90-Day Progress Calendar</h2>
      <button class="reset-btn" onclick="resetPlan()">Reset Plan</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="day-grid" id="day-grid"></div>
    <div id="day-detail-panel"></div>
  </div>
</div>

const MODULE_MAP = {};
const DAY_MAP = {};
MODULES.forEach(m => {
  MODULE_MAP[m.id] = m;
  for (let d = m.startDay; d <= m.endDay; d++) {
    DAY_MAP[d] = m;
  }
});

let state = loadState();

function loadState() {
  try {
    const saved = localStorage.getItem('devops_tracker_v2');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  return { startDate: null, completed: [], notes: {} };
}

function saveState() {
  try { localStorage.setItem('devops_tracker_v2', JSON.stringify(state)); } catch(e) {}
}

function getCurrentDay() {
  if (!state.startDate) return null;
  const start = new Date(state.startDate);
  const now = new Date();
  const diff = Math.floor((now - start) / 86400000) + 1;
  return Math.min(Math.max(diff, 1), 90);
}

function startPlan() {
  state.startDate = new Date().toISOString().split('T')[0];
  saveState();
  renderAll();
}

function resetPlan() {
  if (confirm('Reset your 90-day plan? This will clear all progress and notes.')) {
    state = { startDate: null, completed: [], notes: {} };
    saveState();
    renderAll();
  }
}

function toggleDay(dayNum) {
  const curDay = getCurrentDay();
  if (dayNum > curDay) return;
  const idx = state.completed.indexOf(dayNum);
  if (idx >= 0) state.completed.splice(idx, 1);
  else state.completed.push(dayNum);
  saveState();
  renderTracker();
  renderDashboard();
  updateDayBadge();
}

function saveNote(dayNum) {
  const val = document.getElementById('note-input-' + dayNum)?.value || '';
  state.notes[dayNum] = val;
  saveState();
  const btn = document.getElementById('save-note-btn-' + dayNum);
  if (btn) { btn.textContent = 'Saved ✓'; setTimeout(() => { btn.textContent = 'Save note'; }, 1500); }
}

function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + id).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => { if (t.textContent.toLowerCase().includes(id.substring(0,4))) t.classList.add('active'); });
}

function showDayDetail(dayNum) {
  const mod = DAY_MAP[dayNum];
  const topic = mod ? (mod.plan[dayNum] || mod.name) : '';
  const isCompleted = state.completed.includes(dayNum);
  const curDay = getCurrentDay();
  const isFuture = dayNum > curDay;
  const note = state.notes[dayNum] || '';

  const panel = document.getElementById('day-detail-panel');
  panel.innerHTML = `
    <div class="day-detail">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <div style="background:${mod?.color || '#888'};color:#000;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700;">Day ${dayNum}</div>
        <div style="font-size:13px;color:var(--muted);">${mod?.name || ''}</div>
        ${isCompleted ? '<div style="color:var(--accent);font-size:13px;font-weight:600;">✓ Complete</div>' : ''}
      </div>
      <h3 style="font-size:15px;margin-bottom:6px;">${topic}</h3>
      ${!isFuture ? `
      <div style="margin-top:16px;">
        <div class="section-label">Notes</div>
        <textarea class="note-input" id="note-input-${dayNum}" placeholder="What did you learn today? Any blockers?">${note}</textarea>
        <button class="save-note-btn" id="save-note-btn-${dayNum}" onclick="saveNote(${dayNum})">Save note</button>
        <button class="save-note-btn" style="margin-left:8px;${isCompleted?'border-color:var(--accent);color:var(--accent);':''}" onclick="toggleDay(${dayNum})">
          ${isCompleted ? '✓ Marked Complete' : '○ Mark as Complete'}
        </button>
      </div>` : '<div style="color:var(--muted2);font-size:13px;margin-top:12px;">This day is ahead of schedule — keep going!</div>'}
    </div>`;
}

function renderDashboard() {
  const content = document.getElementById('dashboard-content');
  if (!state.startDate) {
    content.innerHTML = `
      <div class="start-section">
        <div style="font-size:64px;margin-bottom:16px;">🚀</div>
        <h1>Your 90-Day DevOps Journey</h1>
        <p>17 modules · Free resources · Daily tracking · Hands-on projects</p>
        <button class="start-btn" onclick="startPlan()">Start My Plan Today</button>
        <p style="margin-top:20px;font-size:13px;color:var(--muted2);">Or explore modules and the daily tracker above first</p>
      </div>`;
    return;
  }

  const curDay = getCurrentDay();
  const mod = DAY_MAP[curDay];
  const completedMods = MODULES.filter(m => {
    for (let d = m.startDay; d <= m.endDay; d++) { if (!state.completed.includes(d)) return false; }
    return true;
  });
  const streak = calcStreak();
  const pct = Math.round((state.completed.length / 90) * 100);
  const topic = mod ? (mod.plan[curDay] || mod.name) : 'Plan complete!';
  const isTodayDone = state.completed.includes(curDay);

  content.innerHTML = `
    <div class="dash-grid">
      <div class="stat-card">
        <div class="stat-label">Current Day</div>
        <div class="stat-value">${curDay}<span style="font-size:16px;color:var(--muted)">/90</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${(curDay/90)*100}%"></div></div>
        <div class="stat-sub">${90-curDay} days remaining</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Days Completed</div>
        <div class="stat-value green">${state.completed.length}<span style="font-size:16px;color:var(--muted)"> / ${curDay}</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="stat-sub">${pct}% of total plan done</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🔥 Streak</div>
        <div class="stat-value orange">${streak}<span style="font-size:16px;color:var(--muted)"> days</span></div>
        <div class="stat-sub">${completedMods.length} of 17 modules complete</div>
      </div>
    </div>

    <div class="today-card">
      <h2>Today — Day ${curDay}</h2>
      <div class="today-module">
        <div class="module-dot" style="background:${mod?.color+'22' || '#333'}">${mod?.icon || '✓'}</div>
        <div class="today-info">
          <h3>Module ${mod?.id || ''}: ${mod?.name || 'All done!'}</h3>
          <div class="today-topic">${topic}</div>
          <div class="today-desc">Days ${mod?.startDay}–${mod?.endDay} · ${(mod?.endDay||0)-(mod?.startDay||0)+1} days</div>
        </div>
      </div>
      <button class="complete-btn ${isTodayDone?'done':''}" onclick="toggleDay(${curDay});renderDashboard();">
        ${isTodayDone ? '✓ Day Complete' : '○ Mark Today Complete'}
      </button>
    </div>

    <div style="margin-bottom:8px;font-size:13px;color:var(--muted);">Module Progress</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${MODULES.map(m => {
        const daysDone = Array.from({length: m.endDay - m.startDay + 1}, (_,i) => m.startDay+i).filter(d => state.completed.includes(d)).length;
        const total = m.endDay - m.startDay + 1;
        const mpct = Math.round((daysDone/total)*100);
        const isActive = curDay >= m.startDay && curDay <= m.endDay;
        return `<div style="background:var(--bg3);border:1px solid ${isActive?m.color+'44':' var(--border)'};border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;">
          <span style="font-size:18px;width:28px;text-align:center;">${m.icon}</span>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
              <span style="font-size:13px;font-weight:600;">${m.id}. ${m.name}</span>
              <span style="font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;">${daysDone}/${total} days</span>
            </div>
            <div class="progress-bar" style="margin:0;height:5px;"><div style="height:100%;border-radius:3px;width:${mpct}%;background:${m.color};transition:width .5s;"></div></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function calcStreak() {
  const curDay = getCurrentDay();
  if (!curDay) return 0;
  let streak = 0;
  for (let d = curDay; d >= 1; d--) {
    if (state.completed.includes(d)) streak++;
    else break;
  }
  return streak;
}

function renderModules() {
  const container = document.getElementById('modules-content');
  container.innerHTML = MODULES.map(m => {
    const curDay = getCurrentDay() || 0;
    const daysDone = Array.from({length: m.endDay - m.startDay + 1}, (_,i) => m.startDay+i).filter(d => state.completed.includes(d)).length;
    const total = m.endDay - m.startDay + 1;
    const status = curDay > m.endDay ? '✓ Done' : curDay >= m.startDay ? '▶ Active' : '○ Upcoming';
    const statusColor = curDay > m.endDay ? 'var(--accent)' : curDay >= m.startDay ? 'var(--accent2)' : 'var(--muted2)';
    return `
    <div class="module-card" id="mod-card-${m.id}">
      <div class="module-card-header" onclick="toggleMod(${m.id})">
        <div class="mod-icon" style="background:${m.color}22;font-size:18px;">${m.icon}</div>
        <div class="mod-info">
          <div class="mod-name" style="color:${m.color};">${m.id}. ${m.name}</div>
          <div class="mod-days">Days ${m.startDay}–${m.endDay} · ${total} days · ${daysDone}/${total} complete</div>
        </div>
        <span class="mod-status" style="color:${statusColor};font-weight:600;">${status}</span>
        <span class="chevron" style="font-size:12px;margin-left:8px;">▼</span>
      </div>
      <div class="module-card-body">
        <p style="font-size:14px;color:var(--muted);margin-bottom:12px;">${m.overview}</p>
        <div class="section-label">Key Topics</div>
        <div class="topics-list">${m.topics.map(t => `<span class="topic-tag">${t}</span>`).join('')}</div>
        <div class="section-label">Free Learning Resources</div>
        <div class="resources-list">${m.resources.map(r => `
          <a class="resource-link" href="${r.url}" target="_blank" rel="noopener">
            <span class="res-type ${r.type}">${r.type}</span>
            <span style="flex:1">${r.name}</span>
            <span style="color:var(--muted2);font-size:12px;">↗</span>
          </a>`).join('')}</div>
        <div class="section-label">Hands-On Project</div>
        <div class="handson-box">💪 ${m.handsOn}</div>
        <div class="section-label">Daily Plan</div>
        ${Object.entries(m.plan).map(([d, t]) => `
          <div style="display:flex;gap:10px;margin-bottom:6px;align-items:flex-start;">
            <span style="font-family:'Space Mono',monospace;font-size:11px;color:${m.color};background:${m.color}18;padding:2px 7px;border-radius:4px;flex-shrink:0;margin-top:1px;">Day ${d}</span>
            <span style="font-size:13px;color:var(--text);">${t}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleMod(id) {
  const card = document.getElementById('mod-card-' + id);
  card.classList.toggle('open');
}

function renderTracker() {
  const curDay = getCurrentDay() || 0;

  // Legend
  const legend = document.getElementById('legend');
  legend.innerHTML = MODULES.map(m =>
    `<div class="legend-item"><div class="legend-dot" style="background:${m.color}"></div>${m.name}</div>`
  ).join('') + `<div class="legend-item"><div class="legend-dot" style="background:var(--bg4);border:1px solid var(--border2);"></div>Upcoming</div>`;

  // Grid
  const grid = document.getElementById('day-grid');
  grid.innerHTML = Array.from({length:90}, (_,i) => {
    const d = i + 1;
    const mod = DAY_MAP[d];
    const color = mod?.color || '#888';
    const isDone = state.completed.includes(d);
    const isFuture = d > curDay;
    const isToday = d === curDay;
    const alpha = isFuture ? '18' : isDone ? 'ff' : '40';
    const bgColor = isFuture ? 'var(--bg3)' : `${color}${alpha}`;
    const textColor = isFuture ? 'var(--muted2)' : isDone ? '#000' : color;
    return `<div class="day-cell ${isFuture?'future':''} ${isDone?'completed':''} ${isToday?'today':''}"
      style="background:${bgColor};color:${textColor};${isToday?`border-color:${color};`:''}"
      onclick="${isFuture?'':'showDayDetail('+d+')'}"
      title="Day ${d}: ${DAY_MAP[d]?.name || ''}">
      <div class="day-num">${d}</div>
    </div>`;
  }).join('');
}

function updateDayBadge() {
  const badge = document.getElementById('day-badge');
  const curDay = getCurrentDay();
  if (curDay) badge.innerHTML = `Day <b>${curDay}</b>/90`;
  else badge.innerHTML = '';
}

function renderAll() {
  renderDashboard();
  renderModules();
  renderTracker();
  updateDayBadge();
}

renderAll();
</script>
